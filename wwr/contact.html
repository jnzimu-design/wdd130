<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | WhiteWater Rafting</title>
    <meta name="description"
      content="This page will include contact information and a contact form">
    <meta name="author" content="Jacques O. Nzimu">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Wwr Logo" width="200">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>White Water Rafting Company</h1>
        <p>123 Main River Street</p>
        <p>Kolo, California</p>
        <p>Phone: +1 999 999 9999 </p>
        <p>Email: <a href="mailto:info@whitewater.com">info@whitewater.com</a></p>

        <div class="contact-container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7867.2712115664135!2d-13.622470000000039!3d9.626610000000003!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2s!4v1785537607525!5m2!1sfr!2s"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form action="#" method="post">
                <div>
                    <label for="fullname">Name:</label>
                    <input type="text" name="fullname" id="fullname" required>
                </div>

                <div class="form-item column2">
                    <label for="useremail">Email Address:</label>
                    <input type="email" name="useremail" id="useremail" required>
                </div>

                <div class="message">

                </div>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <input type="radio" id="general" name="purpose" checked>
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="website" name="purpose">
                    <label for="website">Website Suggestion</label>
                </fieldset>

                <label for="feedback">Message</label>
                <textarea name="feedback" id="feedback" rows="4" placeholder="Type Here"></textarea>
                <input type="checkbox" name="pet" id="pet">
                <label for="pet">Please Subscribe me to the monthly newsletter</label>
                <button type="submit">Get in Touch</button>
            </form>
        </div>

        <section class="adventure">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee-one.jpg" alt="Sales Manager Profile">
                <figcaption>
                    Sales Manager
                </figcaption>
            </figure>
            <figure>
                <img src="images/employee-two.jpg" alt="Project Manager Profile">
                <figcaption>
                    Project Manager
                </figcaption>
            </figure>
            <figure>
                <img src="images/employee-three.jpg" alt="Safety Manager Profile">
                <figcaption>
                    Safety Manager
                </figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©2026 🌴WhiteWater Rafting🌴 Jacques O. Nzimu</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook-logo.png" alt="Facebook Logo">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram-logo.png" alt="Instagram logo">
            </a>
            <a href="https://x.com">
                <img src="images/x-logo.png" alt="X logo">
            </a>
        </nav>
    </footer>
</body>

</html>
