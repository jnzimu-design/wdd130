<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <h1>Basic HTML and CSS Quiz</h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1. What is does the acronym CSS stabd for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="quiz-item">
                <label for="q2">2. How are id and class attributes select in CSS?</label>
                <textarea type="text" id="q2" name="q2"></textarea>
            </div>

            <div class="quiz-item">
                <label for="q3">3. Which of the following is valid CSS comment?</label>
                <select id="q3" id="q3" name="q3">
                    <option value="" selected disabled>Choose One</option>
                    <option value="a">&lt; !-- This is a comment --&gt;</option>
                    <option value="b">&lt; !-- This is a comment --&gt;</option>
                    <option value="c">&lt; !-- This is a comment --&gt;</option>
                </select>
            </div>

            <div class="quiz-item">
                <label for="q4">4. What is the bottom margin given this declaration?</label>
                <code>margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">Submit My Quiz</button>

        </form>
    </main>
</body>

</html>
